name: Java compatibility and GE lifecycle
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compile against latest RuneLite API
        run: gradle --no-daemon --console=plain clean compileJava compileTestJava
      - name: Run dependency-free event regression
        run: bash smoke/run_offline.sh
